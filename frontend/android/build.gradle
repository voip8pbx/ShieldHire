buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        googlePlayServicesVersion = "18.2.0"
        playServicesLocationVersion = "21.3.0"
        REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native")
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

plugins {
    id("com.facebook.react.rootproject") version "0.77.3"
}
allprojects {
    repositories {
        mavenCentral()
        google()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url "$rootDir/../../node_modules/react-native/android"
        }
    }

    configurations.all {
        resolutionStrategy {
            force "com.facebook.react:react-android:0.77.3"
            force "com.facebook.react:hermes-android:0.77.3"
            force "com.google.android.gms:play-services-location:21.3.0"
        }
    }
}


